<svg xmlns="http://www.w3.org/2000/svg" width="854" height="200" viewBox="0 0 854 200" role="img" aria-label="resumes-CV —— 用 LaTeX 模块化构建属于你的精美简历">
  <title>resumes-CV</title>
  <defs>
    <!-- 背景：深墨 → 主题深蓝(cvsection) → 主题蓝(cvicon) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#2C3E50"/>
      <stop offset="1" stop-color="#2980B9"/>
    </linearGradient>
    <!-- 标题文字渐变：瓷白 → 暖金，配投影在深蓝底上做出烫金质感 -->
    <linearGradient id="title" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFF4D6"/>
      <stop offset="0.8" stop-color="#F0D08A"/>
      <stop offset="1" stop-color="#DDB25A"/>
    </linearGradient>
    <!-- 副标题：白 → 淡蓝 -->
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDF5FD"/>
      <stop offset="1" stop-color="#A9D6F4"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-40%" width="130%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="7" flood-color="#04121E" flood-opacity="0.5"/>
    </filter>
    <style>
      .t   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; }
      .cjk { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; font-weight: 500; }
      .fade { animation: fadein 1.2s ease-in-out both; }
      @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
    </style>
  </defs>

  <!-- 波浪：三层叠加，越靠上越亮，形成柔和的层次 -->
  <path d="M0 0 H854 V138 C700 176 566 146 427 158 C288 170 152 192 0 156 Z" fill="url(#bg)"/>
  <path d="M0 0 H854 V112 C690 146 566 116 427 128 C288 140 152 166 0 128 Z" fill="#FFFFFF" opacity="0.07"/>
  <path d="M0 0 H854 V80 C700 110 566 84 427 96 C288 108 152 130 0 98 Z" fill="#FFFFFF" opacity="0.05"/>

  <text class="t fade" x="427" y="90" text-anchor="middle" font-size="60" fill="url(#title)" filter="url(#soft)">resumes-CV</text>
  <text class="cjk fade" x="427" y="126" text-anchor="middle" font-size="18" fill="url(#sub)">用 LaTeX 模块化构建属于你的精美简历 💖</text>
</svg>
