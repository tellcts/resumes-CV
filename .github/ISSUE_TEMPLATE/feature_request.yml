name: ✨ 功能与组件建议
description: 提议新增组件、扩展字段、调整版式或改进构建与发布流程
title: "[功能建议] "
body:
  - type: markdown
    attributes:
      value: |
        如果现有功能没有按预期工作，请改用“🐞 问题反馈”。如果你发现文档、示例或
        截图需要修正，请使用“📚 文档反馈”。

  - type: dropdown
    id: category
    attributes:
      label: 改进类别
      options:
        - 新增简历组件
        - 扩展现有组件的键值字段
        - 调整版式、间距或视觉样式
        - 改进 Docker 编译脚本
        - 改进 GitHub Actions 或 Release
        - 改善使用体验
        - 其他
    validations:
      required: true

  - type: input
    id: affected_template
    attributes:
      label: 涉及的模板目录
      description: 如果适用于所有模板，可填写“全部”；不确定时可以留空。
      placeholder: template-tzcan
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与当前痛点
      description: 请描述真实的使用流程、受影响的用户，以及现有方案为什么不够用。
      placeholder: 多段教育经历共用 content 字段时会显得拥挤，希望提供可选的紧凑模式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的改动
      description: 描述期望看到的行为。组件建议可给出命令或键值接口草案，但不必完整实现。
      placeholder: |
        为组件增加 compact = {true} 字段。
        未填写时保持现有输出，避免破坏已有简历。
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 选择你能判断的最接近情况；不确定时可选择“不确定”。
      options:
        - 不改变现有接口或输出
        - 新增可选字段，保持向后兼容
        - 可能改变现有接口或默认输出
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代做法？为什么更倾向于当前建议？
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: 验证方式
      description: 说明怎样判断改动有效，例如编译验证、示例调用、截图对比或跨页检查。
      placeholder: 在 main.tex 中使用新字段，执行 latexmk main.tex，并对比新增字段前后的 PDF。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可添加参考链接、草图、接口示例或愿意承担的维护工作。
    validations:
      required: false
