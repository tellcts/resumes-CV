name: Release Templates

on:
  push:
    tags:
      - "v*"

jobs:
  # 先编译校验：调用 build-check.yml，编译全部模板（镜像与文档里的 Docker 方案一致）。
  # 任一模板编不过，release 直接不跑 —— 保证发出去的 zip 一定编得出来。
  build-check:
    uses: ./.github/workflows/build-check.yml

  release:
    needs: build-check
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package templates
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          mkdir -p dist

          VERSION="${GITHUB_REF_NAME#v}"

          package_paths=(
            ".latexmkrc"
            "main.tex"
            "assets"
            "scripts"
            "styles"
            "USAGE.md"
          )

          for dir in template-*/; do
            [ -f "${dir}main.tex" ] || continue
            name="${dir%/}"

            for required in "${package_paths[@]}"; do
              if [ ! -e "${dir}${required}" ]; then
                echo "Missing required release path: ${dir}${required}" >&2
                exit 1
              fi
            done

            echo "Packaging template: $name"

            zip_name="Resume.Template.${name#template-}-${VERSION}.zip"

            git archive \
              --format=zip \
              --prefix="${name#template-}/" \
              -o "dist/${zip_name}" \
              "${GITHUB_REF_NAME}:${name}" \
              "${package_paths[@]}"

          done

          echo "Generated files:"
          ls -lh dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists, uploading assets..."

            gh release upload \
              "$GITHUB_REF_NAME" \
              dist/*.zip \
              --clobber

          else
            echo "Creating release..."

            gh release create \
              "$GITHUB_REF_NAME" \
              dist/*.zip \
              --title "Release $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
